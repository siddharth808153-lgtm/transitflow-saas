[www]
root = public/
index = index.php

[PHP]
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
post_max_size = 50M
upload_max_filesize = 50M
max_execution_time = 120

[opcache]
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
